  # 有对应核心接口时通知配方刷新，不修改核心配置。
  leavesx-recipe-sync: true

display-names: {}

jade-display-items:
  "farmersdelight:cabbages": "farmersdelight:cabbage"
  "farmersdelight:tomatoes": "farmersdelight:tomato"

client-mod:
  enabled: true
