name: CraftEngineClientBridge
version: '${version}'
main: cc.cebridge.CraftEngineBridgePlugin
api-version: '1.20'
description: CraftEngine content synchronization for optional client mods.
authors: [chy]
folia-supported: true
depend: [CraftEngine]
softdepend: [PapersDelight]

commands:
  cebridge:
    description: CraftEngineClientBridge admin commands
    usage: /cebridge <reload|info|status|recipes>
    permission: cebridge.admin
    aliases: [ceb]

permissions:
  cebridge.admin:
    description: Allows managing CraftEngineClientBridge
    default: op
